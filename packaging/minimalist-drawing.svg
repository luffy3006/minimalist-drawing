<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0d0d11" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="#27272a" stroke-width="6" />

  <!-- Grid dots for whiteboard canvas feel -->
  <circle cx="120" cy="120" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="180" cy="120" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="240" cy="120" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="300" cy="120" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="360" cy="120" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="120" cy="180" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="180" cy="180" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="240" cy="180" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="300" cy="180" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="360" cy="180" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="120" cy="240" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="180" cy="240" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="120" cy="300" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="180" cy="300" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="120" cy="360" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="180" cy="360" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="240" cy="360" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="300" cy="360" r="3" fill="#3f3f46" opacity="0.6"/>
  <circle cx="360" cy="360" r="3" fill="#3f3f46" opacity="0.6"/>

  <!-- Glowing stroke / curve -->
  <path d="M 120 340 C 180 390, 240 210, 310 270 C 350 310, 380 290, 400 240"
        fill="none" stroke="url(#strokeGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Pen Body -->
  <g transform="translate(190, 70) rotate(42)">
    <!-- Pen Barrel -->
    <rect x="-18" y="0" width="36" height="150" rx="8" fill="#27272a" stroke="#52525b" stroke-width="4" />
    <rect x="-14" y="10" width="28" height="40" rx="4" fill="#3f3f46" />
    <!-- Accent Ring -->
    <rect x="-18" y="125" width="36" height="12" fill="#38bdf8" />
    <!-- Nib Base -->
    <polygon points="-16,150 16,150 0,195" fill="url(#nibGrad)" />
    <!-- Nib Slit -->
    <line x1="0" y1="150" x2="0" y2="185" stroke="#18181b" stroke-width="2" />
    <circle cx="0" cy="170" r="2.5" fill="#18181b" />
  </g>
</svg>
